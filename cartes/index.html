  <!-- Accueil d'OustaCards -->
  <section id="menu" class="screen">
    <header class="topbar">
      <a href="../" aria-label="Retour">‹</a>
      <h1>OustaCards</h1>
      <span style="width:40px"></span>
    </header>
    <main class="page">
      <div class="hero">
        <div class="hero-fan" id="heroFan"></div>
        <p>Quatre grands classiques, à jouer du bout du doigt.</p>
      </div>
      <nav class="tiles" id="tiles"></nav>
      <h3 class="sect">Le tapis</h3>
      <div class="swatches" id="felts"></div>
      <h3 class="sect">Le dos des cartes</h3>
      <div class="swatches" id="backs"></div>
      <h3 class="sect">Le son</h3>
      <button class="toggle" id="snd">Bruits des cartes<i></i></button>
    </main>
  </section>

  <!-- Une partie -->
  <section id="game" class="screen" hidden>
    <header class="gbar">
      <button class="gbtn" id="bBack" aria-label="Retour au menu">‹</button>
      <div class="gtitle"><b id="gName"></b><small id="gSub"></small></div>
      <button class="gbtn" id="bOpts" aria-label="Options">•••</button>
    </header>
    <div id="stage"></div>
    <footer class="gfoot">
      <button id="bNew"><svg><use href="#ic-new"/></svg><span>Nouvelle</span></button>
      <div class="gstat"><b id="sTime">0:00</b><span id="sMoves">0 coup</span></div>
      <button id="bHint"><svg><use href="#ic-hint"/></svg><span>Indice</span></button>
      <button id="bUndo"><svg><use href="#ic-undo"/></svg><span>Annuler</span></button>
    </footer>
  </section>

  <dialog id="dlg"></dialog>
  <div class="toast" id="toast"></div>
  <canvas id="fx"></canvas>
