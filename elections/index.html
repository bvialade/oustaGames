<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Isoloir 2027 · OustaGames</title>
  <meta name="theme-color" content="#070b1f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../style.css">
  <style>
    /* Thème « soirée électorale » : bleu nuit, touches tricolores, or pour le gagnant. */
    :root {
      --bg: #070b1f; --card: rgba(255,255,255,.06); --card2: rgba(255,255,255,.1); --text: #f1f5ff; --muted: #94a3c4;
      --border: rgba(255,255,255,.12); --accent: #60a5fa; --bleu: #3b82f6; --rouge: #ef4444; --gold: #fbbf24;
      --oui: #22c55e; --non: #f43f5e;
    }
    body {
      min-height: 100dvh;
      background: radial-gradient(110% 50% at 50% -10%, #1e2a6b 0%, transparent 70%), var(--bg);
      background-attachment: fixed;
    }
    .topbar { border-bottom: 0; padding: 8px 12px 0; }
    .topbar h1 { font-weight: 900; letter-spacing: .03em; }
    .grad { background: linear-gradient(90deg, #60a5fa, #fff 50%, #f87171); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .page { padding: 10px 16px 24px; }
    .screen { animation: enter .45s cubic-bezier(.2,.8,.2,1); }
    @keyframes enter { from { opacity: 0; transform: translateY(14px); } }
    [hidden] { display: none !important; }
    .muted { color: var(--muted); }
    .small { font-size: .82rem; }
    a { color: var(--accent); }

    /* Accueil */
    #bulletins { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    #bulletins i {
      position: absolute; top: -40px; width: 22px; height: 30px; border-radius: 3px;
      background: linear-gradient(#fff 0 30%, #e5e7eb 30%); opacity: .05;
      animation: tombe linear infinite;
    }
    @keyframes tombe { to { transform: translateY(110vh) rotate(360deg); } }
    main { position: relative; z-index: 1; overflow-x: clip; }
    .hero { text-align: center; padding: 18px 0 8px; }
    .hero .logo { font-size: 3.2rem; filter: drop-shadow(0 6px 24px rgba(96,165,250,.45)); animation: flotte 3s ease-in-out infinite; }
    @keyframes flotte { 50% { transform: translateY(-6px); } }
    .hero h2 { font-size: 2.3rem; margin: 4px 0 0; font-weight: 900; letter-spacing: .02em; }
    .hero p { margin: 6px 0 0; color: var(--muted); }
    .compte { display: flex; justify-content: center; gap: 8px; margin: 18px 0 6px; }
    .compte div { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 8px 4px; min-width: 62px; text-align: center; }
    .compte b { display: block; font-size: 1.6rem; font-variant-numeric: tabular-nums; }
    .compte span { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .sous-compte { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 18px; }
    .btn { border-radius: 14px; }
    .btn.go { background: linear-gradient(90deg, #2563eb, #4f46e5); box-shadow: 0 8px 24px rgba(59,130,246,.35); }
    .btn.secondary { background: var(--card); border-color: var(--border); color: var(--text); }
    .btn small { display: block; font-weight: 400; opacity: .8; font-size: .8rem; }
    .duel-banner { background: linear-gradient(90deg, rgba(239,68,68,.2), rgba(59,130,246,.2)); border: 1px solid var(--border); border-radius: 14px; padding: 12px; margin-bottom: 12px; text-align: center; }
    .avert { margin-top: 18px; font-size: .78rem; color: var(--muted); text-align: center; line-height: 1.4; }

    /* Partie */
    .hud { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .hud .bar { flex: 1; height: 6px; background: var(--card2); border-radius: 3px; overflow: hidden; }
    .hud .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #3b82f6, #fff, #ef4444); transition: width .4s; }
    .hud .n { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    .theme-chip { display: inline-flex; gap: 6px; align-items: center; font-size: .85rem; padding: 4px 10px; border-radius: 99px; background: var(--card2); }
    .pile { position: relative; min-height: 300px; margin: 10px 0 12px; }
    .carte {
      position: relative; background: linear-gradient(160deg, #1b2556, #121a40); border: 1px solid rgba(255,255,255,.14);
      border-radius: 22px; padding: 18px 18px 16px; box-shadow: 0 18px 40px rgba(0,0,0,.45);
      touch-action: pan-y; will-change: transform; min-height: 280px; display: flex; flex-direction: column;
    }
    .carte.arrive { animation: arrive .35s cubic-bezier(.2,.9,.3,1.2); }
    @keyframes arrive { from { transform: translateY(30px) scale(.94); opacity: 0; } }
    .carte.hint { animation: wiggle 1.6s ease-in-out .6s 2; }
    @keyframes wiggle { 20% { transform: translateX(28px) rotate(2deg); } 45% { transform: translateX(-28px) rotate(-2deg); } 65% { transform: none; } }
    .carte .fantome { position: absolute; inset: 8px -6px -8px; border-radius: 22px; background: rgba(255,255,255,.05); z-index: -1; }
    .carte .tete { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .carte .texte { font-size: 1.42rem; font-weight: 800; line-height: 1.25; margin: 18px 0 12px; flex: 1; }
    .coeur { background: none; border: 1px solid var(--border); border-radius: 99px; padding: 4px 10px; font-size: .8rem; color: var(--muted); }
    .coeur.on { color: #fff; background: rgba(244,63,94,.25); border-color: #f43f5e; animation: pop .3s; }
    @keyframes pop { 50% { transform: scale(1.15); } }
    .comprendre { background: none; border: 0; color: var(--accent); padding: 0; font-size: .9rem; text-align: left; }
    .ctx { font-size: .88rem; line-height: 1.4; margin-top: 10px; color: #cbd5f5; }
    .ctx p { margin: 0 0 6px; }
    .ctx b { color: #fff; }
    .tampon {
      position: absolute; top: 22px; padding: 6px 12px; border: 3px solid; border-radius: 10px; font-weight: 900;
      font-size: 1.15rem; letter-spacing: .04em; opacity: 0; transform: rotate(-12deg); pointer-events: none;
    }
    .tampon.oui { right: 16px; color: var(--oui); }
    .tampon.non { left: 16px; color: var(--non); transform: rotate(12deg); }
    .teinte { position: absolute; inset: 0; border-radius: 22px; pointer-events: none; opacity: 0; }
    .reponses { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .reponses button {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 8px 2px 6px;
      font-size: .66rem; line-height: 1.15; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .reponses button b { font-size: 1.05rem; color: var(--text); }
    .reponses button:active { transform: scale(.95); }
    .reponses .r-2 b, .reponses .r-1 b { color: var(--non); }
    .reponses .r2 b, .reponses .r1 b { color: var(--oui); }
    .actions { display: flex; justify-content: space-between; margin-top: 10px; }
    .lien { background: none; border: 0; color: var(--muted); font-size: .9rem; padding: 6px 2px; }
    .direct { margin-top: 16px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 10px 12px; }
    .direct h3 { margin: 0 0 6px; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .direct h3::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--rouge); animation: rec 1.2s infinite; }
    @keyframes rec { 50% { opacity: .2; } }
    .live { position: relative; height: 170px; }
    .live .ligne { position: absolute; left: 0; right: 0; height: 30px; display: flex; align-items: center; gap: 8px; transition: transform .6s cubic-bezier(.3,.9,.3,1), opacity .4s; }
    .live .nom { width: 96px; font-size: .82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .live .jauge { flex: 1; height: 8px; background: var(--card2); border-radius: 4px; overflow: hidden; }
    .live .jauge i { display: block; height: 100%; border-radius: 4px; transition: width .6s; }
    .live .pct { width: 40px; text-align: right; font-size: .82rem; font-variant-numeric: tabular-nums; }
    .live .delta { position: absolute; right: 44px; font-size: .75rem; font-weight: 800; color: var(--oui); animation: monte 1s forwards; }
    @keyframes monte { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-16px); } }
    .avatar { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .72rem; color: #0b1020; }

    /* Flash et dépouillement */
    .overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(4,7,20,.82); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    .flash { text-align: center; padding: 24px; animation: zoom .4s cubic-bezier(.2,.9,.3,1.3); }
    .flash .petit { color: var(--muted); font-size: .9rem; text-transform: uppercase; letter-spacing: .1em; }
    .flash .gros { font-size: 1.8rem; font-weight: 900; margin: 10px 0 4px; }
    @keyframes zoom { from { transform: scale(.7); opacity: 0; } }
    .urne-scene { text-align: center; }
    .urne-scene p { font-size: 1.1rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; animation: rec 1s infinite; }
    .urne { position: relative; width: 150px; height: 170px; margin: 0 auto 18px; }
    .urne .boite { position: absolute; bottom: 0; left: 10px; width: 130px; height: 110px; border-radius: 10px; background: rgba(147,197,253,.18); border: 2px solid rgba(191,219,254,.7); }
    .urne .fente { position: absolute; bottom: 106px; left: 45px; width: 60px; height: 8px; border-radius: 4px; background: #0b1020; border: 2px solid rgba(191,219,254,.7); }
    .urne .enveloppe { position: absolute; left: 50px; top: -10px; width: 50px; height: 34px; background: #fde68a; border-radius: 4px; animation: glisse 1.4s cubic-bezier(.5,0,.6,1) forwards; }
    .urne .enveloppe::after { content: ""; position: absolute; inset: 0; background: linear-gradient(155deg, transparent 49%, #f59e0b 50%, transparent 52%), linear-gradient(25deg, transparent 49%, #f59e0b 50%, transparent 52%); }
    @keyframes glisse { 60% { transform: translateY(70px) rotate(90deg); } 100% { transform: translateY(120px) rotate(90deg) scaleX(.2); opacity: 0; } }
    #confettis { position: fixed; inset: 0; pointer-events: none; z-index: 30; }

    /* Résultats */
    .podium-hero { text-align: center; padding: 18px 12px; border-radius: 22px; background: linear-gradient(160deg, rgba(251,191,36,.18), rgba(59,130,246,.12)); border: 1px solid rgba(251,191,36,.4); margin-bottom: 14px; }
    .podium-hero .avatar { width: 76px; height: 76px; font-size: 1.5rem; margin: 6px auto 8px; box-shadow: 0 0 0 4px rgba(251,191,36,.6), 0 0 40px rgba(251,191,36,.45); animation: zoom .6s cubic-bezier(.2,.9,.3,1.4); }
    .podium-hero .label { color: var(--gold); font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; font-weight: 800; }
    .podium-hero .nom { font-size: 1.5rem; font-weight: 900; }
    .podium-hero .big { font-size: 3rem; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .onglets { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; scrollbar-width: none; }
    .onglets button { flex: none; background: var(--card); border: 1px solid var(--border); color: var(--muted); border-radius: 99px; padding: 7px 12px; font-size: .85rem; }
    .onglets button.on { background: #fff; color: #0b1020; font-weight: 700; }
    .rang { display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-radius: 12px; opacity: 0; transform: translateX(-20px); animation: entre .5s forwards; }
    .rang:active { background: var(--card); }
    @keyframes entre { to { opacity: 1; transform: none; } }
    .rang .num { width: 20px; text-align: right; color: var(--muted); font-size: .85rem; }
    .rang .info { flex: 1; min-width: 0; }
    .rang .info b { display: block; font-size: .95rem; }
    .rang .info span { font-size: .75rem; color: var(--muted); }
    .rang .jauge { height: 6px; background: var(--card2); border-radius: 3px; overflow: hidden; margin-top: 4px; }
    .rang .jauge i { display: block; height: 100%; }
    .rang .pct { font-weight: 800; font-variant-numeric: tabular-nums; }
    .rang.partiel { filter: grayscale(1); opacity: .6 !important; }
    .note { font-size: .78rem; color: var(--muted); margin: 10px 0; line-height: 1.4; }
    svg text { fill: var(--text); font-family: inherit; }
    .carte-svg .pt { transition: transform 1.1s cubic-bezier(.2,.9,.3,1.1); }
    .halo { animation: halo 1.6s infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes halo { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(2.4); opacity: 0; } }
    .theme-res { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--border); }
    .theme-res .e { font-size: 1.3rem; width: 30px; text-align: center; }
    .theme-res .t { flex: 1; font-size: .9rem; }
    .theme-res .t span { display: block; color: var(--muted); font-size: .78rem; }

    /* Fiche « Pourquoi ? » */
    .sheet { position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; }
    .sheet .in { background: #0f1533; border-top: 1px solid var(--border); border-radius: 22px 22px 0 0; width: 100%; max-height: 88dvh; overflow-y: auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); animation: up .35s cubic-bezier(.2,.9,.3,1); }
    @keyframes up { from { transform: translateY(100%); } }
    .sheet .in > * { max-width: 520px; margin-left: auto; margin-right: auto; }
    .sheet h3 { margin: 0; }
    .qa { padding: 10px 0; border-bottom: 1px solid var(--border); font-size: .88rem; }
    .qa .q { font-weight: 600; margin-bottom: 6px; }
    .echelle { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin: 4px 0; }
    .echelle span { height: 22px; border-radius: 6px; background: var(--card); position: relative; font-size: .62rem; display: grid; place-items: center; color: var(--muted); }
    .echelle span.toi { outline: 2px solid #fff; color: #fff; }
    .echelle span.lui { background: var(--c); color: #0b1020; font-weight: 700; }
    .synth { font-size: .82rem; color: #cbd5f5; margin: 6px 0; }

    /* Duel */
    .duel-q { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .86rem; perspective: 600px; }
    .duel-q .flip { width: 30px; height: 30px; flex: none; border-radius: 8px; display: grid; place-items: center; font-weight: 900; background: var(--card2); animation: flip .6s backwards; }
    @keyframes flip { from { transform: rotateY(90deg); } }
    .duel-q .flip.ok { background: rgba(34,197,94,.25); color: var(--oui); }
    .duel-q .flip.ko { background: rgba(244,63,94,.25); color: var(--non); }
    input.nom { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--text); font: inherit; margin: 8px 0; -webkit-user-select: text; user-select: text; }

    /* Méthode */
    .table-wrap { overflow-x: auto; margin: 10px -16px; padding: 0 16px; }
    table.grille { border-collapse: collapse; font-size: .72rem; }
    table.grille th, table.grille td { padding: 5px 4px; border-bottom: 1px solid var(--border); text-align: center; white-space: nowrap; }
    table.grille td:first-child, table.grille th:first-child { text-align: left; white-space: normal; min-width: 180px; position: sticky; left: 0; background: var(--bg); }
    table.grille th { writing-mode: vertical-rl; transform: rotate(180deg); font-weight: 600; height: 96px; }
    table.grille th:first-child { writing-mode: horizontal-tb; transform: none; }
    .methode h3 { margin: 18px 0 6px; }
    .methode p, .methode li { font-size: .9rem; line-height: 1.45; color: #d6def7; }
  </style>
</head>
<body>
  <div id="bulletins"></div>
  <header class="topbar">
    <a href="../" aria-label="Retour au menu" id="retour">‹</a>
    <h1><span class="grad">Isoloir 2027</span></h1>
    <button class="icon-btn" id="btn-methode" aria-label="Méthode">ⓘ</button>
  </header>
  <main class="page" id="app"></main>
  <canvas id="confettis"></canvas>
  <script src="data.js"></script>
  <script src="jeu.js"></script>
</body>
</html>
