<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Géographie · OustaGames</title>
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../style.css">
  <style>
    .section-title { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 18px 4px 8px; }
    .choices { display: grid; gap: 8px; }
    .choices.two { grid-template-columns: 1fr 1fr; }
    .chip {
      padding: 14px 12px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--card); text-align: left; font-size: 1rem;
    }
    .chip small { display: block; color: var(--muted); font-size: .8rem; margin-top: 2px; }
    .chip.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
    .progress { display: flex; justify-content: space-between; color: var(--muted); font-size: .9rem; margin-bottom: 10px; }
    .bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 18px; }
    .bar div { height: 100%; background: var(--accent); transition: width .3s; }
    .question { text-align: center; margin-bottom: 18px; }
    .question img { max-width: 100%; max-height: 32dvh; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.18); }
    .question h2 { font-size: 1.5rem; margin: 8px 0 0; }
    .question p { color: var(--muted); margin: 4px 0 0; }
    .answer { padding: 16px; font-size: 1.05rem; text-align: center; }
    .answer.right { background: var(--good); color: #fff; border-color: transparent; }
    .answer.wrong { background: var(--error); color: #fff; border-color: transparent; }
    .result { text-align: center; padding-top: 20px; }
    .result .big { font-size: 3.5rem; font-weight: 800; margin: 10px 0; }
    .recap { text-align: left; margin: 20px 0; display: grid; gap: 6px; font-size: .9rem; }
    .recap div:not(.section-title) { padding: 8px 10px; border-radius: 8px; background: var(--card); border: 1px solid var(--border); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="../" id="back" aria-label="Retour">‹</a>
    <h1>Géographie</h1>
    <span style="min-width:40px"></span>
  </header>

  <main class="page" id="setup">
    <div class="section-title">Jeu</div>
    <div class="choices" id="modes"></div>
    <div class="section-title">Zone</div>
    <div class="choices two" id="regions"></div>
    <div class="section-title">Nombre de questions</div>
    <div class="choices two" id="lengths"></div>
    <div style="height:20px"></div>
    <button class="btn" id="start">Commencer</button>
  </main>

  <main class="page" id="play" hidden>
    <div class="progress"><span id="count"></span><span id="score"></span></div>
    <div class="bar"><div id="bar-fill"></div></div>
    <div class="question" id="question"></div>
    <div class="choices" id="answers"></div>
  </main>

  <main class="page result" id="result" hidden>
    <div id="result-text"></div>
    <div class="big" id="result-score"></div>
    <p id="result-best"></p>
    <button class="btn" id="replay">Rejouer</button>
    <button class="btn secondary" id="to-setup">Changer de jeu</button>
    <div class="recap" id="recap"></div>
  </main>

  <script src="countries.js"></script>
  <script src="geo.js"></script>
</body>
</html>
