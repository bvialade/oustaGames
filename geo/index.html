<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Géographie · OustaGames</title>
  <meta name="theme-color" content="#0a1224">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../style.css">
  <style>
    /* Thème « atlas » : nuit bleue, accents émeraude et ambre. */
    :root {
      --bg: #0a1224; --card: rgba(255,255,255,.06); --card2: rgba(255,255,255,.1); --text: #eef4ff; --muted: #8fa0bf;
      --border: rgba(255,255,255,.12); --accent: #34d399; --accent2: #38bdf8; --gold: #fbbf24;
      --good: #22c55e; --error: #f43f5e; --land: #1d2b45; --land-line: #2b3d5f;
    }
    body {
      min-height: 100dvh;
      background: radial-gradient(120% 45% at 50% -8%, #123a52 0%, transparent 70%), var(--bg);
      background-attachment: fixed;
    }
    .topbar { border-bottom: 0; padding: 8px 12px 0; }
    .topbar h1 { font-weight: 800; letter-spacing: .02em; }
    .topbar h1 span {
      background: linear-gradient(90deg, var(--accent), var(--accent2), var(--gold));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .page { padding: 10px 16px 24px; }
    .screen { animation: enter .45s cubic-bezier(.2,.8,.2,1); }
    @keyframes enter { from { opacity: 0; transform: translateY(14px); } }

    /* Carte du monde (aperçu de zone et révélation de la réponse) */
    .map { width: 100%; height: 100%; display: block; }
    .map .grat { fill: none; stroke: rgba(120,170,255,.07); }
    .map .land { fill: var(--land); stroke: var(--land-line); transition: fill .5s, opacity .5s; }
    .map .bg { fill: var(--land); stroke: none; }
    .map .land.on { fill: #2a6f6a; stroke: #3f8f87; }
    .map .land.hit { fill: var(--accent); stroke: #fff; }
    .map .land.miss { fill: var(--gold); stroke: #fff; }
    .map .land.bad { fill: var(--error); opacity: .8; }
    .map .ring { fill: none; stroke: #fff; animation: ring 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes ring { from { transform: scale(.2); opacity: 1; } to { transform: scale(1); opacity: 0; } }
    .map .pin { fill: #fff; stroke: var(--bg); }

    .hero {
      height: 150px; border-radius: 22px; overflow: hidden; position: relative;
      border: 1px solid var(--border); box-shadow: inset 0 0 50px rgba(0,0,0,.5);
      background: radial-gradient(90% 90% at 50% 40%, #0d2340, #071425 75%);
    }
    .hero .tag {
      position: absolute; left: 12px; bottom: 10px; padding: 5px 11px; border-radius: 999px; font-size: .78rem; font-weight: 700;
      background: rgba(6,16,31,.75); border: 1px solid var(--border); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    }

    .section-title { font-size: .72rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 18px 4px 8px; font-weight: 700; }
    .modes { display: grid; gap: 8px; }
    .mode {
      display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; text-align: left;
      border: 1px solid var(--border); background: var(--card); transition: transform .15s, border-color .25s, background .25s;
    }
    .mode:active { transform: scale(.98); }
    .mode .ico { width: 44px; height: 44px; flex: none; display: grid; place-items: center; font-size: 1.5rem; border-radius: 12px; background: rgba(255,255,255,.07); transition: transform .4s cubic-bezier(.2,.9,.3,1.6); }
    .mode b { display: block; font-size: 1rem; }
    .mode small { display: block; color: var(--muted); font-size: .8rem; margin-top: 1px; }
    .mode .best { margin-left: auto; flex: none; font-size: .75rem; font-weight: 700; color: var(--gold); text-align: right; }
    .mode.active { border-color: rgba(52,211,153,.7); background: linear-gradient(135deg, rgba(52,211,153,.18), rgba(56,189,248,.08)); }
    .mode.active .ico { transform: rotate(-8deg) scale(1.1); background: rgba(52,211,153,.25); }

    .pills { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: 0 -2px; }
    .pills::-webkit-scrollbar { display: none; }
    .pills button {
      flex: none; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--card); color: var(--muted); font-size: .85rem; font-weight: 600; transition: all .25s;
    }
    .pills button.active { color: #04121f; border-color: transparent; background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 4px 18px rgba(52,211,153,.35); }
    .seg { display: flex; padding: 3px; background: var(--card); border-radius: 999px; border: 1px solid var(--border); }
    .seg button { flex: 1; border: 0; background: none; color: var(--muted); padding: 8px 6px; border-radius: 999px; font-size: .88rem; font-weight: 600; transition: all .25s; }
    .seg button.active { background: #fff; color: #0b1220; }

    .btn { border-radius: 16px; padding: 15px; font-size: 1.05rem; transition: transform .15s; }
    .btn:active { transform: scale(.97); }
    .btn.go {
      position: relative; overflow: hidden; color: #04121f;
      background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 8px 26px rgba(52,211,153,.3);
    }
    .btn.go::after {
      content: ''; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent); animation: shine 3.2s ease-in-out infinite;
    }
    @keyframes shine { 0%, 55% { left: -60%; } 100% { left: 130%; } }
    .btn.secondary { background: var(--card); border-color: var(--border); }
    #start { margin-top: 22px; position: sticky; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 2; }

    /* Partie */
    .hud { display: flex; align-items: center; gap: 10px; font-size: .85rem; color: var(--muted); margin-bottom: 8px; }
    .hud .count { font-variant-numeric: tabular-nums; }
    .hud .count b { color: var(--text); }
    .streak {
      margin-left: auto; padding: 3px 10px; border-radius: 999px; font-weight: 800; color: var(--gold);
      background: rgba(251,191,36,.12); border: 1px solid rgba(251,191,36,.35); opacity: 0; transform: scale(.6); transition: all .3s cubic-bezier(.2,.9,.3,1.5);
    }
    .streak.show { opacity: 1; transform: none; }
    .streak.pop { animation: pop .5s cubic-bezier(.2,.9,.3,1.6); }
    .score { font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; padding: 3px 10px; border-radius: 999px; background: var(--card); }
    .score.pop { animation: pop .5s cubic-bezier(.2,.9,.3,1.6); }
    @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
    .bar { height: 8px; background: rgba(255,255,255,.08); border-radius: 4px; overflow: hidden; margin-bottom: 14px; }
    .bar div { height: 100%; width: 0; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--accent2)); box-shadow: 0 0 12px rgba(52,211,153,.6); transition: width .5s cubic-bezier(.2,.8,.2,1); }

    /* La carte question se retourne pour montrer le pays sur la carte. */
    .card { perspective: 1200px; height: clamp(180px, 31dvh, 270px); margin-bottom: 14px; }
    .card .inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.3,.7,.2,1); }
    .compact .card { height: clamp(150px, 23dvh, 210px); }
    .card { transition: height .4s cubic-bezier(.2,.8,.2,1); }
    .card.flipped .inner { transform: rotateY(180deg); }
    .face {
      position: absolute; inset: 0; border-radius: 22px; overflow: hidden; -webkit-backface-visibility: hidden; backface-visibility: hidden;
      border: 1px solid var(--border); background: linear-gradient(160deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
      box-shadow: 0 14px 40px rgba(0,0,0,.35);
    }
    .front { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; text-align: center; }
    .front.in { animation: cardin .55s cubic-bezier(.2,.9,.3,1.2); }
    @keyframes cardin { from { opacity: 0; transform: translateX(40px) rotate(3deg) scale(.95); } }
    .front .flag { max-width: 88%; max-height: 70%; border-radius: 8px; box-shadow: 0 8px 30px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.15); animation: wave 4s ease-in-out infinite; }
    @keyframes wave { 50% { transform: perspective(500px) rotateY(-7deg) rotateX(2deg); } }
    .front .mini { width: 54px; height: 36px; object-fit: cover; border-radius: 5px; box-shadow: 0 0 0 1px rgba(255,255,255,.2); margin-bottom: 10px; }
    .front .pinicon { font-size: 2.2rem; margin-bottom: 6px; animation: bob 2s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-6px); } }
    .front h2 { font-size: clamp(1.5rem, 7vw, 2.1rem); margin: 0; line-height: 1.15; }
    .front p { color: var(--muted); margin: 10px 0 0; font-size: .92rem; }
    .back { transform: rotateY(180deg); background: radial-gradient(90% 90% at 50% 40%, #0d2340, #071425 75%); }
    .back .caption {
      position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: 14px; background: rgba(6,16,31,.8); border: 1px solid var(--border);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    }
    .back .caption img { width: 36px; height: 24px; object-fit: cover; border-radius: 4px; flex: none; }
    .back .caption b { display: block; font-size: .98rem; }
    .back .caption small { color: var(--muted); font-size: .8rem; }

    .answers { display: grid; gap: 8px; }
    .answer {
      position: relative; display: flex; align-items: center; gap: 12px; padding: 13px 12px; border-radius: 16px; text-align: left;
      font-size: 1.02rem; font-weight: 600; border: 1px solid var(--border); background: var(--card);
      animation: slidein .45s cubic-bezier(.2,.9,.3,1.2) both; transition: background .25s, border-color .25s, opacity .3s, transform .15s;
    }
    .answer:active { transform: scale(.98); }
    .answer .key { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: 9px; font-size: .8rem; font-weight: 800; background: rgba(255,255,255,.08); color: var(--muted); transition: all .25s; }
    @keyframes slidein { from { opacity: 0; transform: translateY(14px); } }
    .answer.right { background: rgba(34,197,94,.22); border-color: var(--good); box-shadow: 0 0 0 1px var(--good), 0 0 26px rgba(34,197,94,.35); animation: bump .45s cubic-bezier(.2,.9,.3,1.6); }
    .answer.right .key { background: var(--good); color: #fff; }
    .answer.wrong { background: rgba(244,63,94,.2); border-color: var(--error); animation: shake .45s; }
    .answer.wrong .key { background: var(--error); color: #fff; }
    .answer.dim { opacity: .35; }
    @keyframes bump { 40% { transform: scale(1.04); } }
    @keyframes shake { 20%,60% { transform: translateX(-7px); } 40%,80% { transform: translateX(7px); } }
    .plus { position: absolute; right: 14px; font-weight: 900; color: var(--good); animation: rise .9s ease-out forwards; pointer-events: none; }
    @keyframes rise { to { transform: translateY(-34px); opacity: 0; } }

    /* Choix du niveau de chaque question */
    .choose { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .kind {
      display: grid; justify-items: center; gap: 2px; padding: 12px 6px 11px; border-radius: 18px; text-align: center;
      border: 1px solid var(--border); background: var(--card); position: relative; overflow: hidden;
      animation: slidein .45s cubic-bezier(.2,.9,.3,1.2) both; transition: transform .15s;
    }
    .kind::before { content: ''; position: absolute; inset: 0; opacity: .2; background: linear-gradient(160deg, var(--c), transparent 75%); }
    .kind > * { position: relative; }
    .kind:active { transform: scale(.95); }
    .kind.cash { --c: var(--gold); border-color: rgba(251,191,36,.45); }
    .kind.carre { --c: var(--accent2); }
    .kind.indice { --c: #a78bfa; }
    .kind .ico { font-size: 1.6rem; line-height: 1.2; }
    .kind b { font-size: 1rem; }
    .kind em { font-style: normal; font-weight: 900; font-size: .8rem; color: var(--c); }
    .kind small { color: var(--muted); font-size: .7rem; line-height: 1.2; }
    .kind.cash .ico { animation: bob 2s ease-in-out infinite; }

    .hint {
      display: flex; gap: 10px; align-items: flex-start; padding: 11px 12px; margin-bottom: 10px; border-radius: 16px;
      background: linear-gradient(135deg, rgba(167,139,250,.2), rgba(167,139,250,.05)); border: 1px solid rgba(167,139,250,.45);
      animation: slidein .45s cubic-bezier(.2,.9,.3,1.2) both; font-size: .95rem; line-height: 1.35;
    }
    .hint .ico { font-size: 1.4rem; }
    .hint small { display: block; font-size: .68rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 800; color: #c4b5fd; }
    .hint img { height: 44px; border-radius: 5px; margin-top: 4px; box-shadow: 0 0 0 1px rgba(255,255,255,.2); }

    .cash { position: relative; animation: slidein .4s cubic-bezier(.2,.9,.3,1.2) both; }
    .cash .row { display: flex; gap: 8px; }
    #cash-input {
      flex: 1; min-width: 0; font-size: 1.1rem; padding: 14px 15px; border-radius: 16px; outline: none; font-weight: 600;
      border: 1px solid rgba(251,191,36,.5); background: rgba(255,255,255,.07); color: var(--text);
      -webkit-user-select: text; user-select: text; transition: border-color .2s, box-shadow .2s, background .25s;
    }
    #cash-input:focus { box-shadow: 0 0 0 4px rgba(251,191,36,.2); }
    .cash .btn { width: auto; padding: 0 18px; }
    #cash-ok { background: linear-gradient(135deg, var(--gold), #f59e0b); color: #241500; }
    .cash .pass { display: block; margin: 8px auto 0; background: none; border: 0; color: var(--muted); font-size: .85rem; text-decoration: underline; padding: 6px; }
    .cash.right #cash-input { border-color: var(--good); background: rgba(34,197,94,.22); box-shadow: 0 0 26px rgba(34,197,94,.35); animation: bump .45s cubic-bezier(.2,.9,.3,1.6); }
    .cash.wrong #cash-input { border-color: var(--error); background: rgba(244,63,94,.2); animation: shake .45s; }
    .cash.right .btn, .cash.wrong .btn, .cash.right .pass, .cash.wrong .pass { display: none; }
    #verdict { text-align: center; margin-top: 10px; font-weight: 700; min-height: 1.3em; }
    .cash.right #verdict { color: #86efac; } .cash.wrong #verdict { color: #fda4af; }
    #verdict b { color: var(--text); }
    .plus.gold { color: var(--gold); font-size: 1.3rem; top: 10px; }
    .cash .plus { top: 12px; }

    #next {
      margin-top: 12px; position: relative; overflow: hidden; opacity: 0; transform: translateY(10px); pointer-events: none;
      transition: opacity .3s, transform .3s; background: rgba(255,255,255,.1); border: 1px solid var(--border); color: var(--text);
    }
    #next.show { opacity: 1; transform: none; pointer-events: auto; }
    #next i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(52,211,153,.28); }
    #next.auto i { animation: fill var(--t) linear forwards; }
    #next span { position: relative; }
    @keyframes fill { to { width: 100%; } }

    /* Résultat */
    .result { text-align: center; }
    .gauge { position: relative; width: 190px; height: 190px; margin: 6px auto 4px; }
    .gauge svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .gauge circle { fill: none; stroke-width: 14; }
    .gauge .track { stroke: rgba(255,255,255,.08); }
    .gauge .val { stroke: url(#grad); stroke-linecap: round; filter: drop-shadow(0 0 8px rgba(52,211,153,.6)); }
    .gauge .mid { position: absolute; inset: 0; display: grid; place-content: center; }
    .gauge .pct { font-size: 2.4rem; font-weight: 900; font-variant-numeric: tabular-nums; }
    .gauge .of { color: var(--muted); font-size: .9rem; }
    .stars { font-size: 2rem; letter-spacing: 6px; height: 44px; }
    .stars span { display: inline-block; opacity: .18; filter: grayscale(1); }
    .stars span.on { opacity: 1; filter: none; animation: star .6s cubic-bezier(.2,.9,.3,1.8) both; }
    @keyframes star { from { transform: scale(0) rotate(-90deg); } }
    #result-text { font-size: 1.6rem; font-weight: 800; margin: 2px 0 4px; }
    #result-best { color: var(--muted); margin: 0 0 6px; min-height: 1.3em; }
    #result-best.record { color: var(--gold); font-weight: 800; animation: pop .6s .9s both; }
    .facts { display: grid; grid-template-columns: repeat(4, 1fr); margin: 10px 0 18px; padding: 12px 0; border-radius: 16px; background: var(--card); border: 1px solid var(--border); }
    .facts b { display: block; font-size: 1.15rem; }
    .facts span { font-size: .7rem; white-space: nowrap; color: var(--muted); }
    .recap { text-align: left; margin: 18px 0 0; display: grid; gap: 6px; }
    .recap .item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); animation: slidein .4s both; }
    .recap img { width: 32px; height: 22px; object-fit: cover; border-radius: 4px; flex: none; }
    .recap b { display: block; font-size: .92rem; }
    .recap small { color: var(--muted); font-size: .8rem; }
    #fx { position: fixed; inset: 0; pointer-events: none; z-index: 20; width: 100%; height: 100%; }
    [hidden] { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="../" id="back" aria-label="Retour">‹</a>
    <h1><span>Géographie</span></h1>
    <span style="min-width:40px"></span>
  </header>

  <main class="page screen" id="setup">
    <div class="hero">
      <svg class="map" id="hero-map"></svg>
      <div class="tag" id="hero-tag"></div>
    </div>
    <div class="section-title">Jeu</div>
    <div class="modes" id="modes"></div>
    <div class="section-title">Zone</div>
    <div class="pills" id="regions"></div>
    <div class="section-title">Questions</div>
    <div class="seg" id="lengths"></div>
    <button class="btn go" id="start">C'est parti</button>
  </main>

  <main class="page screen" id="play" hidden>
    <div class="hud">
      <span class="count" id="count"></span>
      <span class="streak" id="streak"></span>
      <span class="score" id="score"></span>
    </div>
    <div class="bar"><div id="bar-fill"></div></div>
    <div class="card" id="card">
      <div class="inner">
        <div class="face front" id="question"></div>
        <div class="face back">
          <svg class="map" id="play-map"></svg>
          <div class="caption" id="caption"></div>
        </div>
      </div>
    </div>
    <div class="choose" id="choose"></div>
    <div class="hint" id="hint" hidden></div>
    <div class="answers" id="answers"></div>
    <form class="cash" id="cash" hidden autocomplete="off">
      <div class="row">
        <input id="cash-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="done">
        <button class="btn" id="cash-ok" type="submit">OK</button>
      </div>
      <button class="pass" id="cash-pass" type="button">Je ne sais pas</button>
      <div id="verdict"></div>
    </form>
    <button class="btn" id="next"><i></i><span>Suivant</span></button>
  </main>

  <main class="page screen result" id="result" hidden>
    <div class="gauge">
      <svg viewBox="0 0 200 200">
        <defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs>
        <circle class="track" cx="100" cy="100" r="86"/>
        <circle class="val" id="gauge-val" cx="100" cy="100" r="86"/>
      </svg>
      <div class="mid"><div class="pct" id="result-pct">0 pt</div><div class="of" id="result-score"></div></div>
    </div>
    <div class="stars" id="stars"></div>
    <div id="result-text"></div>
    <p id="result-best"></p>
    <div class="facts" id="facts"></div>
    <button class="btn go" id="replay">Rejouer</button>
    <button class="btn secondary" id="retry-misses">Rejouer mes erreurs</button>
    <button class="btn secondary" id="to-setup">Changer de jeu</button>
    <div class="recap" id="recap"></div>
  </main>

  <canvas id="fx"></canvas>

  <script src="countries.js"></script>
  <script src="indices.js"></script>
  <script src="../frontieres/data.js"></script>
  <script src="geo.js"></script>
</body>
</html>
