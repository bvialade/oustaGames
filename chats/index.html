<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OustaCats · OustaGames</title>
  <meta name="theme-color" content="#fde7d3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../style.css">
  <style>
    :root { --bg: #fff4ea; --card: #fffdf9; --text: #3b2a20; --muted: #94786a; --border: #ead6c6; --accent: #f07a3a; }
    body {
      min-height: 100dvh;
      background:
        radial-gradient(90% 50% at 0% 0%, rgba(250,180,140,.45), transparent 60%),
        radial-gradient(80% 50% at 100% 100%, rgba(180,220,160,.4), transparent 60%), var(--bg);
      background-attachment: fixed;
    }
    .topbar { border-bottom: 0; }
    .topbar h1 { font-weight: 800; color: #5b3a2b; }
    .topbar h1 span { color: var(--accent); }
    .parade { display: flex; justify-content: center; gap: 2px; margin: 4px 0 18px; }
    .parade span { width: 30px; height: 30px; animation: bob 2.4s ease-in-out infinite; }
    .parade svg { width: 100%; height: 100%; }
    @keyframes bob { 0%,100% { transform: none; } 50% { transform: translateY(-5px); } }
    .games { display: grid; gap: 12px; }
    .game {
      display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 20px;
      background: var(--card); border: 1px solid var(--border); color: inherit; text-decoration: none;
      box-shadow: 0 6px 18px rgba(91,58,43,.1);
    }
    .game .pic { width: 64px; height: 64px; flex: none; border-radius: 16px; display: grid; padding: 4px; }
    .game .pic svg { width: 100%; height: 100%; }
    .game.sudo .pic { background: #fbd3b4; }
    .game.panier .pic { background: #a7d676; }
    .game h2 { margin: 0; font-size: 1.15rem; }
    .game p { margin: 3px 0 0; color: var(--muted); font-size: .9rem; line-height: 1.3; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute"><defs id="cat-defs"></defs></svg>
  <header class="topbar">
    <a href="../" aria-label="Retour au menu">‹</a>
    <h1>Ousta<span>Cats</span></h1>
    <span style="min-width:40px"></span>
  </header>
  <main class="page">
    <div class="parade" id="parade"></div>
    <nav class="games">
      <a class="game sudo" href="../sudochat/">
        <span class="pic"><svg viewBox="0 0 100 100"><use href="#cat0"/></svg></span>
        <div><h2>Sudochat</h2><p>Un sudoku avec des chats, du 4×4 au 9×9, et une grille du jour.</p></div>
      </a>
      <a class="game panier" href="../paniers/">
        <span class="pic"><svg viewBox="0 0 100 100"><use href="#cat8"/></svg></span>
        <div><h2>Chacun son panier</h2><p>Un chat par couleur, par ligne et par colonne, sans qu'ils se touchent. 150 niveaux et un défi du jour.</p></div>
      </a>
    </nav>
  </main>
  <script src="dessins.js"></script>
  <script>
    defineCats();
    document.getElementById('parade').innerHTML = CATS.map((_, v) =>
      `<span style="animation-delay:${v * 0.15}s">${cat(v)}</span>`).join('');
  </script>
</body>
</html>
