<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Quiz du droit · OustaGames</title>
  <meta name="theme-color" content="#0f1729">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../style.css">
  <style>
    :root {
      --bg: #0f1729; --card: rgba(255,255,255,.07); --text: #f8f5ec; --muted: #a9b0c4;
      --border: rgba(255,255,255,.14); --accent: #d4a937; --good: #22c55e; --error: #ef4444;
    }
    body {
      min-height: 100dvh;
      background: radial-gradient(110% 60% at 0% 0%, rgba(212,169,55,.28), transparent 60%),
                  radial-gradient(90% 50% at 100% 100%, rgba(59,91,219,.35), transparent 60%), var(--bg);
      background-attachment: fixed;
    }
    .topbar { border-bottom: 0; }
    .glass { background: var(--card); border: 1px solid var(--border); border-radius: 20px; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
    .btn { background: linear-gradient(135deg, #d4a937, #b7791f); color: #1a1405; border-radius: 16px; box-shadow: 0 8px 24px rgba(212,169,55,.3); }
    .btn.secondary { background: var(--card); color: var(--text); box-shadow: none; border: 1px solid var(--border); }
    .btn:disabled { opacity: .4; box-shadow: none; }
    [hidden] { display: none !important; }

    .intro { text-align: center; padding: 22px 18px; }
    .intro .seal { font-size: 2.6rem; }
    .intro h2 { font-size: 1.6rem; margin: 4px 0 6px; }
    .intro > p { color: var(--muted); margin: 0 0 18px; }
    .label { font-size: .78rem; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); margin: 18px 2px 8px; text-align: left; }
    .levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .level { padding: 12px 6px; border-radius: 14px; border: 1px solid var(--border); background: rgba(255,255,255,.04); }
    .level b { display: block; font-size: 1.4rem; }
    .level span { display: block; font-weight: 700; margin-top: 2px; }
    .level small { display: block; color: var(--muted); font-size: .72rem; margin-top: 2px; }
    .level.on { border-color: var(--accent); background: rgba(212,169,55,.18); box-shadow: 0 0 0 1px var(--accent) inset; }
    .themes { display: flex; flex-wrap: wrap; gap: 8px; }
    .theme { padding: 9px 12px; border-radius: 999px; border: 1px solid var(--border); background: rgba(255,255,255,.04); font-size: .9rem; }
    .theme.on { border-color: var(--accent); background: rgba(212,169,55,.2); }
    .theme.all { font-weight: 700; }
    .start { margin-top: 20px; }
    .best { margin-top: 10px; color: var(--muted); font-size: .85rem; min-height: 1.2em; }

    .progress { display: flex; gap: 4px; margin-bottom: 16px; }
    .progress i { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); transition: background .3s; }
    .progress i.ok { background: var(--good); }
    .progress i.ko { background: var(--error); }
    .progress i.now { background: #fff; }
    .qcard { padding: 20px 18px; animation: pop .4s cubic-bezier(.2,.9,.3,1.2); }
    @keyframes pop { from { transform: translateY(14px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
    .qnum { display: flex; justify-content: space-between; gap: 8px; font-size: .8rem; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
    .qcard h2 { font-size: 1.15rem; line-height: 1.38; margin: 8px 0 16px; }
    .choices { display: grid; gap: 8px; }
    .choice { text-align: left; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--border);
      background: rgba(255,255,255,.05); font-size: 1rem; line-height: 1.3; transition: transform .1s, background .3s; }
    .choice:active { transform: scale(.98); }
    .choice.right { background: var(--good); border-color: transparent; color: #fff; }
    .choice.wrong { background: var(--error); border-color: transparent; color: #fff; animation: shake .4s; }
    .choice:disabled:not(.right):not(.wrong) { opacity: .45; }
    @keyframes shake { 20%,60% { transform: translateX(-5px); } 40%,80% { transform: translateX(5px); } }
    .explain { margin-top: 16px; padding: 14px; border-radius: 14px; background: rgba(0,0,0,.25); line-height: 1.45; animation: pop .4s; }
    .explain b { display: block; margin-bottom: 4px; }
    .ref { display: inline-block; margin-top: 10px; padding: 4px 10px; border-radius: 999px; background: rgba(212,169,55,.16); color: #f1d38a; font-size: .85rem; font-weight: 600; }
    .next { margin-top: 16px; }

    .result { text-align: center; padding: 24px 18px; }
    .result .big { font-size: 3.6rem; font-weight: 900; margin: 6px 0;
      background: linear-gradient(90deg, #f1d38a, #93a8f5); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .result .sub { color: var(--muted); margin-bottom: 16px; }
    .recap { text-align: left; margin-top: 18px; display: grid; gap: 8px; }
    .recap div { padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.05); font-size: .9rem; line-height: 1.35; }
    .recap small { color: #f1d38a; }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="../" aria-label="Retour">‹</a>
    <h1>Quiz du droit</h1>
    <span style="min-width:40px"></span>
  </header>

  <main class="page">
    <section id="intro" class="glass intro">
      <div class="seal">⚖️</div>
      <h2>10 questions de droit</h2>
      <p>Choisis ton niveau et tes matières. Chaque réponse est expliquée, avec l'article ou l'arrêt qui va avec.</p>
      <div class="label">Niveau</div>
      <div class="levels" id="levels"></div>
      <div class="label">Matières</div>
      <div class="themes" id="themes"></div>
      <button class="btn start" id="start">C'est parti !</button>
      <div class="best" id="best"></div>
    </section>

    <section id="play" hidden>
      <div class="progress" id="progress"></div>
      <div id="question"></div>
    </section>

    <section id="result" class="glass result" hidden>
      <div id="result-text"></div>
      <div class="big" id="result-score"></div>
      <div class="sub" id="result-sub"></div>
      <button class="btn" id="again">Rejouer</button>
      <button class="btn secondary" id="share">Partager mon score</button>
      <button class="btn secondary" id="home">Changer de niveau ou de matières</button>
      <div class="recap" id="recap"></div>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <script src="themes.js"></script>
  <script src="q/penal.js"></script>
  <script src="q/civil.js"></script>
  <script src="q/social.js"></script>
  <script src="q/affaires.js"></script>
  <script src="q/societes.js"></script>
  <script src="q/suretes.js"></script>
  <script src="q/administratif.js"></script>
  <script src="q/dip.js"></script>
  <script src="q/europeen.js"></script>
  <script src="q/constitutionnel.js"></script>
  <script src="q/libertes.js"></script>
  <script src="droit.js"></script>
</body>
</html>
