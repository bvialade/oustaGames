<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Code de la route · OustaGames</title>
  <meta name="theme-color" content="#16191f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../style.css">
  <style>
    :root {
      --bg: #16191f; --card: rgba(255,255,255,.07); --text: #f8fafc; --muted: #a3acb9;
      --border: rgba(255,255,255,.14); --accent: #facc15; --good: #22c55e; --error: #ef4444;
    }
    body {
      min-height: 100dvh;
      background:
        repeating-linear-gradient(90deg, transparent 0 calc(50% - 3px), rgba(255,255,255,.05) calc(50% - 3px) calc(50% + 3px), transparent calc(50% + 3px) 100%),
        radial-gradient(100% 55% at 0% 0%, rgba(250,204,21,.22), transparent 60%),
        radial-gradient(90% 50% at 100% 100%, rgba(34,197,94,.22), transparent 60%), var(--bg);
      background-attachment: fixed;
    }
    .topbar { border-bottom: 0; }
    .glass { background: var(--card); border: 1px solid var(--border); border-radius: 20px; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
    .btn { background: linear-gradient(135deg, #facc15, #eab308); color: #1a1505; border-radius: 16px; box-shadow: 0 8px 24px rgba(250,204,21,.25); }
    .btn.secondary { background: var(--card); color: var(--text); box-shadow: none; border: 1px solid var(--border); }
    .btn:disabled { opacity: .4; box-shadow: none; }
    [hidden] { display: none !important; }

    .intro { text-align: center; padding: 22px 18px; }
    .intro .seal { font-size: 2.6rem; }
    .intro h2 { font-size: 1.6rem; margin: 4px 0 6px; }
    .intro > p { color: var(--muted); margin: 0 0 6px; }
    .label { font-size: .78rem; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); margin: 18px 2px 8px; text-align: left; }
    .modes { display: grid; gap: 8px; }
    .mode { display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--border); background: rgba(255,255,255,.04); }
    .mode b { font-size: 1.5rem; }
    .mode strong { display: block; }
    .mode small { display: block; color: var(--muted); font-size: .8rem; margin-top: 2px; }
    .mode.on { border-color: var(--accent); background: rgba(250,204,21,.15); box-shadow: 0 0 0 1px var(--accent) inset; }
    .mode:disabled { opacity: .4; }
    .themes { display: flex; flex-wrap: wrap; gap: 8px; }
    .theme { padding: 9px 12px; border-radius: 999px; border: 1px solid var(--border); background: rgba(255,255,255,.04); font-size: .9rem; }
    .theme.on { border-color: var(--accent); background: rgba(250,204,21,.2); }
    .theme.all { font-weight: 700; }
    .start { margin-top: 20px; }
    .best { margin-top: 10px; color: var(--muted); font-size: .85rem; line-height: 1.5; }

    .playbar { display: flex; justify-content: flex-end; margin: -6px 0 8px; }
    .playbar button { background: none; border: 0; color: var(--muted); font-size: .85rem; padding: 4px 0; }
    .progress { display: flex; gap: 4px; margin-bottom: 16px; }
    .progress.long { gap: 2px; }
    .progress i { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); transition: background .3s; }
    .progress i.ok { background: var(--good); }
    .progress i.ko { background: var(--error); }
    .progress i.done { background: var(--accent); }
    .progress i.now { background: #fff; }
    .qcard { padding: 20px 18px; animation: pop .4s cubic-bezier(.2,.9,.3,1.2); }
    @keyframes pop { from { transform: translateY(14px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
    .qnum { display: flex; justify-content: space-between; gap: 8px; font-size: .8rem; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
    .qnum span:first-child { white-space: nowrap; }
    .qnum span:last-child { text-align: right; }
    .signwrap { display: grid; place-items: center; margin: 14px 0 4px; }
    .signwrap .sign { width: 130px; height: 130px; filter: drop-shadow(0 6px 14px rgba(0,0,0,.45)); }
    .sign.mini { width: 28px; height: 28px; vertical-align: middle; margin-right: 4px; }
    .qcard h2 { font-size: 1.15rem; line-height: 1.38; margin: 8px 0 14px; }
    .multi { display: inline-block; margin: -4px 0 12px; padding: 3px 10px; border-radius: 999px; background: rgba(250,204,21,.16); color: #fde68a; font-size: .82rem; font-weight: 600; }
    .choices { display: grid; gap: 8px; }
    .choice { display: flex; gap: 12px; align-items: center; text-align: left; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--border);
      background: rgba(255,255,255,.05); font-size: 1rem; line-height: 1.3; transition: transform .1s, background .3s; }
    .choice em { font-style: normal; font-weight: 800; flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: rgba(255,255,255,.1); font-size: .85rem; }
    .choice:active { transform: scale(.98); }
    .choice.sel { border-color: var(--accent); background: rgba(250,204,21,.18); }
    .choice.sel em { background: var(--accent); color: #1a1505; }
    .choice.right { background: var(--good); border-color: transparent; color: #fff; }
    .choice.wrong { background: var(--error); border-color: transparent; color: #fff; animation: shake .4s; }
    .choice.missed { border: 2px dashed var(--good); }
    .choice:disabled:not(.right):not(.wrong):not(.missed) { opacity: .45; }
    @keyframes shake { 20%,60% { transform: translateX(-5px); } 40%,80% { transform: translateX(5px); } }
    .explain { margin-top: 16px; padding: 14px; border-radius: 14px; background: rgba(0,0,0,.25); line-height: 1.45; animation: pop .4s; }
    .explain b { display: block; margin-bottom: 4px; }
    .next { margin-top: 16px; }

    .result { text-align: center; padding: 24px 18px; }
    .result .big { font-size: 3.6rem; font-weight: 900; margin: 6px 0;
      background: linear-gradient(90deg, #fde047, #4ade80); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .result .sub { color: var(--muted); margin-bottom: 16px; }
    .bilan { text-align: left; display: grid; gap: 6px; }
    .bar { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; border-radius: 10px; background: rgba(255,255,255,.05); font-size: .9rem; }
    .bar b.full { color: #4ade80; }
    .bar b.low { color: #f87171; }
    .recap { text-align: left; display: grid; gap: 8px; }
    .recap details { padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.05); font-size: .9rem; line-height: 1.4; }
    .recap summary { cursor: pointer; }
    .recap p { margin: 8px 0 0; }
    .recap b { color: #fde68a; }
    .recap .why { color: var(--muted); }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="../quiz/" aria-label="Retour">‹</a>
    <h1>Code de la route</h1>
    <span style="min-width:40px"></span>
  </header>

  <main class="page">
    <section id="intro" class="glass intro">
      <div class="seal">🚦</div>
      <h2>Révise ton code</h2>
      <p>Les 10 thèmes de l'examen, avec une explication après chaque réponse.</p>
      <div class="label">Mode</div>
      <div class="modes" id="modes"></div>
      <div id="themes-box">
        <div class="label">Thèmes</div>
        <div class="themes" id="themes"></div>
      </div>
      <button class="btn start" id="start">C'est parti !</button>
      <div class="best" id="best"></div>
    </section>

    <section id="play" hidden>
      <div class="playbar"><button id="quit">Arrêter ✕</button></div>
      <div class="progress" id="progress"></div>
      <div id="question"></div>
    </section>

    <section id="result" class="glass result" hidden>
      <div id="result-text"></div>
      <div class="big" id="result-score"></div>
      <div class="sub" id="result-sub"></div>
      <button class="btn" id="again">Rejouer</button>
      <button class="btn secondary" id="share">Partager mon score</button>
      <button class="btn secondary" id="home">Changer de mode ou de thèmes</button>
      <div class="bilan" id="bilan"></div>
      <div class="recap" id="recap"></div>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <script src="themes.js"></script>
  <script src="panneaux.js"></script>
  <script src="q/circulation.js"></script>
  <script src="q/conducteur.js"></script>
  <script src="q/route.js"></script>
  <script src="q/usagers.js"></script>
  <script src="q/divers.js"></script>
  <script src="q/secours.js"></script>
  <script src="q/vehicule.js"></script>
  <script src="q/mecanique.js"></script>
  <script src="q/equipements.js"></script>
  <script src="q/environnement.js"></script>
  <script src="code.js"></script>
</body>
</html>
